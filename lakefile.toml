name = "lean_tls"
version = "0.1.0"
description = "High assurance TLS written in Lean"
keywords = ["tls", "quic", "post-quantum", "cryptography", "protocol"]
license = "AGPL-3.0-only"
defaultTargets = ["LeanTLS"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "cryptlib"
git = "https://github.com/katzenpost/cryptlib.git"
rev = "55c46b84af0dfae892819dabddbc859a1105e4b5"

[[lean_lib]]
name = "LeanTLS"

[[lean_exe]]
name = "LeanTLS.Tests.RFC8448"

[[lean_exe]]
name = "LeanTLS.Tests.Handshake"
